name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (без подписи)
        run: |
          xcodebuild -project Grafana.xcodeproj -scheme Grafana -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Grafana.app Payload/
          zip -r Grafana.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Grafana-ipa
          path: Grafana.ipa
